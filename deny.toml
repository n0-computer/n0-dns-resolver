# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[bans]
multiple-versions = "allow"
# aws-lc-rs is a supported crypto provider here (the `tls-aws-lc-rs` feature), so
# it is not banned. native-tls and openssl are: this crate uses rustls only.
deny = ["native-tls", "openssl", "openssl-sys"]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
yanked = "deny"
ignore = [
    # paste, unmaintained. A proc-macro reached only through the patchbay test
    # lab (patchbay -> rtnetlink -> netlink-packet-core), so it is a Linux
    # dev-dependency and never reaches a user of this crate.
    "RUSTSEC-2024-0436",
]
